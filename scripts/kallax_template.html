<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wes' Kallax Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #ffffff;
    --ink: #12131a;
    --ink-dim: #5b5d6b;
    --ink-faint: #9799a6;
    --rule: #e4e4ea;
    --rule-strong: #cfd0da;
    --stripe: #fafafc;
    --cobalt: #1f3fe0;
    --solo: #7a3fd1;
    --two: #1f3fe0;
    --party: #c8432b;
    --other: #3f6b5c;
    --gap: #eceef4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 0 0 6rem;
  }

  .g-solo { --g: var(--solo); }
  .g-two { --g: var(--two); }
  .g-party { --g: var(--party); }
  .g-other { --g: var(--other); }

  header.masthead {
    max-width: 760px;
    margin: 0 auto;
    padding: 4.5rem 1rem 1.5rem;
    text-align: center;
  }

  .herotitle {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 6vw, 4rem);
    letter-spacing: -0.01em;
    color: var(--cobalt);
    margin: 0 0 0.9rem;
    line-height: 1.05;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--cobalt);
    margin-bottom: 1.3rem;
  }

  .lede {
    font-size: 1rem;
    color: var(--ink-dim);
    max-width: 520px;
    margin: 0 auto 2rem;
  }

  .stat {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.6rem;
  }

  .stat .big {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 3.2rem;
    line-height: 1;
    color: var(--ink);
  }

  .stat .word, .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: var(--ink-dim);
  }

  .meta { margin-top: 0.9rem; font-size: 0.68rem; color: var(--ink-faint); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--g);
    border: 1px solid var(--g);
    border-radius: 3px;
    padding: 0.2rem 0.5rem;
  }

  nav.jump {
    max-width: 900px;
    margin: 1.2rem auto 1rem;
    padding: 0 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.6rem;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
  }

  nav.jump a {
    text-decoration: none;
    color: var(--ink-dim);
    border: 1px solid var(--rule-strong);
    padding: 0.25rem 0.6rem;
    border-radius: 3px;
    transition: all 0.15s ease;
  }

  nav.jump a:hover {
    color: #ffffff;
    background: var(--cobalt);
    border-color: var(--cobalt);
  }

  nav.jump a.dashed { border-style: dashed; color: var(--ink-faint); }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 1rem 1rem 0;
  }

  section.group { margin-bottom: 3rem; }

  .shelf-tag {
    display: flex;
    align-items: baseline;
    gap: 0.55rem;
    padding-bottom: 0.5rem;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid var(--rule-strong);
  }

  .shelf-tag .num {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.7rem;
    color: var(--g);
  }

  .shelf-tag .word {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: var(--ink-dim);
  }

  .shelf-tag .count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    gap: 2rem 1.6rem;
  }

  .cubby-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.45rem;
  }

  .cubby-name {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--g);
  }

  .cubby-fill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-dim);
  }

  /* One cubby's front, to scale. Uncovered space shows as hatching. */
  .frame {
    position: relative;
    aspect-ratio: 1;
    container-type: inline-size;
    border: 3px solid var(--ink);
    border-radius: 2px;
    background: repeating-linear-gradient(45deg, var(--page) 0 5px, var(--gap) 5px 10px);
    overflow: hidden;
  }

  .box {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: color-mix(in srgb, var(--g) 13%, var(--page));
    border: 1px solid var(--g);
    color: var(--ink);
    font-size: clamp(7px, 3.1cqw, 12px);
    line-height: 1.1;
  }

  .box span {
    padding: 1px 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    max-height: 100%;
  }

  .box.upright span { writing-mode: vertical-rl; }
  .box b { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--g); }
  .box.container { border-style: dashed; border-width: 2px; }

  .box.filler {
    background: var(--stripe);
    border-color: var(--ink-faint);
    color: var(--ink-dim);
  }

  .box.filler b { color: var(--ink-faint); }

  .steps {
    margin: 0.7rem 0 0;
    padding-left: 1.6rem;
    font-size: 0.8rem;
    color: var(--ink-dim);
    line-height: 1.35;
  }

  .steps li { margin-bottom: 0.3rem; }
  .steps li::marker { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--ink-faint); }

  .iname {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink);
  }

  .where { display: block; }
  .holds { font-size: 0.74rem; color: var(--ink-faint); font-style: italic; }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    padding: 0.05rem 0.3rem;
    vertical-align: middle;
  }

  .empty {
    text-align: center;
    color: var(--ink-dim);
    padding: 2rem 0;
  }

  .footer {
    max-width: 760px;
    margin: 1rem auto 0;
    padding: 2rem 1rem 0;
    border-top: 1px dashed var(--rule-strong);
  }

  details.extra { margin-bottom: 1.4rem; }

  details.extra summary {
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
  }

  details.extra .count { color: var(--ink-faint); margin-left: 0.3rem; }

  details.extra ul {
    columns: 2 220px;
    column-gap: 1.6rem;
    padding-left: 1.2rem;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  details.extra li { break-inside: avoid; }
  .dim { color: var(--ink-faint); font-size: 0.78rem; }
</style>
</head>
<body>

<header class="masthead">
  <h1 class="herotitle">The Kallax</h1>
  <div class="eyebrow">How the Collection Fits on the Shelves</div>
  <p class="lede">Every cubby drawn to scale from the front. Load each one in the numbered order: bottom up, left to right. Hatching is empty space; grey boxes are fillers from outside the cubby's group.</p>
  {{SUMMARY}}
</header>

<nav class="jump">
{{NAV}}
</nav>

<main>

{{SECTIONS}}

</main>

<div class="footer">
{{FOOTER}}
</div>

</body>
</html>
